name: FBIZ RADAR Daily Update

on:
  schedule:
    # Roda diariamente às 09:30 UTC (06:30 horário de Brasília)
    - cron: '30 9 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Rodar script com Inteligência Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: Commit e Push dos dados atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: atualização diária FBIZ RADAR com Gemini [skip ci]" && git push)
